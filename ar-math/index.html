<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مغامرة الجمع بالواقع المعزز</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:0}
#three{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none}
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 20%,#a75d9d 0,#31243f 38%,#0c0b10 85%)}
.card{width:min(92vw,460px);background:rgba(255,255,255,.97);border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.4)}
.card h1{margin:0;color:#7d316e;font-size:29px}.card p{line-height:1.8;color:#5b5361}.eq{direction:ltr;font-size:43px;font-weight:900;color:#2947a6;margin:16px 0 22px}
.primary{border:0;width:100%;padding:15px;border-radius:17px;background:linear-gradient(135deg,#a43885,#6545b8);color:#fff;font-weight:900;font-size:19px}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;color:#fff;display:none}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:8px;justify-content:center}
.pill{background:rgba(18,17,23,.68);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(9px);padding:10px 14px;border-radius:999px;font-weight:900;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.2)}
#instruction{max-width:78vw}
.placebar{position:absolute;top:max(68px,calc(env(safe-area-inset-top) + 58px));left:50%;transform:translateX(-50%);display:flex;direction:ltr;gap:6px;align-items:center;justify-content:center;pointer-events:none;width:min(94vw,520px)}
.placechip{min-width:86px;padding:8px 12px;border-radius:15px;background:rgba(18,17,23,.58);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);font-weight:900;text-align:center;font-size:15px;opacity:.7;transform:scale(.94);transition:.2s}
.placechip.h{border-color:#64b6ff}.placechip.t{border-color:#59d491}.placechip.o{border-color:#ff83bc}
.placechip.active{opacity:1;transform:scale(1.09);box-shadow:0 0 0 3px rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.3)}
#stageMath{position:absolute;top:max(116px,calc(env(safe-area-inset-top) + 106px));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#2b2530;border-radius:999px;padding:8px 14px;font-weight:900;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.22);font-size:14px}
.btn{pointer-events:auto;border:1px solid rgba(255,255,255,.22);background:rgba(18,17,23,.70);color:#fff;border-radius:999px;padding:10px 14px;font-weight:800}
.icon{width:44px;height:44px;border-radius:50%;padding:0;font-size:19px}
.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#placeHint{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;text-align:center;color:#fff}
#reticle{width:72px;height:72px;border:3px solid rgba(255,255,255,.92);border-radius:50%;margin:auto;box-shadow:0 0 0 10px rgba(255,255,255,.10),0 0 30px rgba(255,255,255,.35)}
#placeHint p{background:rgba(0,0,0,.55);padding:9px 13px;border-radius:999px;font-weight:900}
#err{position:fixed;z-index:30;left:15px;right:15px;bottom:20px;display:none;background:#fff3cd;color:#554500;padding:13px;border-radius:14px;text-align:center;font-weight:800}
#success{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.28);padding:18px}
#success.show{display:flex}.success{background:rgba(255,255,255,.96);border:3px solid #e6c75f;border-radius:28px;padding:28px 22px;text-align:center;color:#222;box-shadow:0 25px 80px rgba(0,0,0,.36)}
.success .result{direction:ltr;font-size:45px;font-weight:900;color:#187754}.success h2{color:#8a3375}.success button{border:0;background:#7e326e;color:#fff;padding:12px 17px;border-radius:14px;font-weight:900}
#debug{position:fixed;z-index:9;top:68px;left:10px;background:rgba(0,0,0,.45);color:white;border-radius:12px;padding:7px 10px;font-size:12px;display:none}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<canvas id="three"></canvas>

<div id="start">
  <div class="card">
    <h1>مغامرة الجمع بالواقع المعزز</h1>
    <p>ستظهر أمامكِ الكاميرا الحقيقية، ثم ثبّتي مكعبات دينز فوق الطاولة ولمسيها واسحبيها لإعادة التجميع.</p>
    <div class="eq">268 + 157</div>
    <button id="startBtn" class="primary">ابدئي النشاط</button>
  </div>
</div>

<div id="hud">
  <div class="top">
    <button id="restart" class="btn icon">↻</button>
    <div id="instruction" class="pill">وجّهي الكاميرا إلى الطاولة</div>
    <button id="help" class="btn icon">؟</button>
  </div>
  <div class="placebar">
    <div id="hundredsChip" class="placechip h">المئات</div>
    <div id="tensChip" class="placechip t">العشرات</div>
    <div id="onesChip" class="placechip o">الآحاد</div>
  </div>
  <div id="stageMath">8 آحاد + 7 آحاد</div>
  <div class="bottom">
    <button id="reposition" class="btn">تغيير مكان المكعبات</button>
    <button id="next" class="btn" style="display:none;background:rgba(27,142,98,.86)">التالي</button>
  </div>
</div>

<div id="placeHint"><div id="reticle"></div><p>المسي المكان الذي تريدين وضع المكعبات عليه</p></div>
<div id="err"></div>
<div id="debug"></div>

<div id="success">
  <div class="success">
    <div style="font-size:46px">⭐</div>
    <div class="result">268 + 157 = 425</div>
    <h2>أحسنتِ يا بطلة الجمع!</h2>
    <button id="again">أعيدي النشاط</button>
  </div>
</div>

<script>
(function(){
const video=document.getElementById('camera');
const canvas=document.getElementById('three');
const start=document.getElementById('start');
const hud=document.getElementById('hud');
const instruction=document.getElementById('instruction');
const placeHint=document.getElementById('placeHint');
const err=document.getElementById('err');
const nextBtn=document.getElementById('next');
const success=document.getElementById('success');
const hundredsChip=document.getElementById('hundredsChip');
const tensChip=document.getElementById('tensChip');
const onesChip=document.getElementById('onesChip');
const stageMath=document.getElementById('stageMath');

let renderer,scene,camera,root,dropRing;
let stage=1,placed=0,anchored=false,regrouping=false;
let draggables=[],dragging=null,dragPlane=null,dragOffset=new THREE.Vector3();
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const clock=new THREE.Clock();

function msg(t){instruction.textContent=t}
function updatePlaceHud(){
  [hundredsChip,tensChip,onesChip].forEach(x=>x.classList.remove('active'));
  if(stage===1){onesChip.classList.add('active');stageMath.textContent='8 آحاد + 7 آحاد';}
  if(stage===2){tensChip.classList.add('active');stageMath.textContent='6 عشرات + 5 عشرات + 1 محمولة';}
  if(stage===3){hundredsChip.classList.add('active');stageMath.textContent='2 مئات + 1 مئة + 1 محمولة';}
}
function showError(t){err.textContent=t;err.style.display='block'}
function hideError(){err.style.display='none'}

async function openCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('camera unsupported');
  const constraints={video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false};
  const stream=await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject=stream;
  await video.play();
}

function initThree(){
  renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.8));
  renderer.setSize(innerWidth,innerHeight,false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);
  camera.position.set(0,0,0);
  scene.add(new THREE.HemisphereLight(0xffffff,0x5b5b6a,1.45));
  const dl=new THREE.DirectionalLight(0xfff5e7,2.1);dl.position.set(3,5,4);dl.castShadow=true;scene.add(dl);
  root=new THREE.Group();root.visible=false;root.rotation.x=-0.42;scene.add(root);
  window.addEventListener('resize',resize);
  canvas.addEventListener('pointerdown',onDown,{passive:false});
  canvas.addEventListener('pointermove',onMove,{passive:false});
  canvas.addEventListener('pointerup',onUp,{passive:false});
  canvas.addEventListener('pointercancel',onUp,{passive:false});
  animate();
}

function resize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
}

function roundedBoxGeometry(w,h,d,r=.04,s=3){
  const shape=new THREE.Shape();
  const x=-w/2,y=-h/2;
  shape.moveTo(x+r,y);shape.lineTo(x+w-r,y);shape.quadraticCurveTo(x+w,y,x+w,y+r);
  shape.lineTo(x+w,y+h-r);shape.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  shape.lineTo(x+r,y+h);shape.quadraticCurveTo(x,y+h,x,y+h-r);
  shape.lineTo(x,y+r);shape.quadraticCurveTo(x,y,x+r,y);
  return new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelSegments:s,steps:1,bevelSize:r*.45,bevelThickness:r*.45}).center();
}

function mat(color,rough=.32,metal=.02){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}

function tagDraggable(obj,type){
  obj.userData.draggable=true;obj.userData.type=type;obj.userData.placed=false;
  obj.traverse(c=>c.userData.dragRoot=obj);
  draggables.push(obj);
}

function makeUnit(color){
  const g=roundedBoxGeometry(.34,.34,.20,.05,2);
  const m=new THREE.Mesh(g,mat(color,.3,.04));m.castShadow=true;m.receiveShadow=true;tagDraggable(m,'one');return m;
}
function makeRod(color){
  const group=new THREE.Group();
  for(let i=0;i<10;i++){
    const m=new THREE.Mesh(roundedBoxGeometry(.24,.24,.17,.035,1),mat(color,.34,.02));
    m.position.y=(i-4.5)*.235;m.castShadow=true;group.add(m);
  }
  tagDraggable(group,'ten');return group;
}
function makeHundred(color){
  const g=new THREE.Group();
  const plate=new THREE.Mesh(roundedBoxGeometry(1.55,1.55,.13,.06,2),mat(color,.36,.01));
  plate.castShadow=true;plate.receiveShadow=true;g.add(plate);
  const lineMat=new THREE.LineBasicMaterial({color:0x155c9c,transparent:true,opacity:.65});
  for(let i=1;i<10;i++){
    let x=-.775+i*.155;
    let geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,-.775,.075),new THREE.Vector3(x,.775,.075)]);
    g.add(new THREE.Line(geo,lineMat));
    let y=-.775+i*.155;
    geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.775,y,.075),new THREE.Vector3(.775,y,.075)]);
    g.add(new THREE.Line(geo,lineMat));
  }
  tagDraggable(g,'hundred');return g;
}

function clearRoot(){
  while(root.children.length) root.remove(root.children[0]);
  draggables=[];dragging=null;
}
function makeTextSprite(text,bg){
  const cnv=document.createElement('canvas');cnv.width=640;cnv.height=190;
  const ctx=cnv.getContext('2d');ctx.direction='rtl';
  ctx.fillStyle=bg;ctx.beginPath();
  const r=34,x=8,y=8,w=624,h=174;
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.88)';ctx.lineWidth=8;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 72px Tahoma, Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,320,99);
  const tex=new THREE.CanvasTexture(cnv);tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(1.35,.40,1);return sp;
}
function addPlaceBoard(){
  const labels=[
    {t:'المئات',x:-1.72,c:'rgba(41,126,211,.92)',on:stage===3},
    {t:'العشرات',x:0,c:'rgba(36,166,105,.92)',on:stage===2},
    {t:'الآحاد',x:1.72,c:'rgba(211,66,132,.92)',on:stage===1}
  ];
  labels.forEach(v=>{
    const s=makeTextSprite(v.t,v.c);s.position.set(v.x,1.78,.30);s.scale.multiplyScalar(v.on?1.18:.9);s.material.opacity=v.on?1:.72;root.add(s);
  });
  const sepMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.28});
  [-.86,.86].forEach(x=>{
    const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,-1.45,.02),new THREE.Vector3(x,1.48,.02)]);
    root.add(new THREE.Line(geo,sepMat));
  });
}
function addBase(){
  addPlaceBoard();
  const zoneGeo=new THREE.RingGeometry(.62,.78,64);
  const zoneMat=new THREE.MeshBasicMaterial({color:0xffdf5a,transparent:true,opacity:.82,side:THREE.DoubleSide});
  dropRing=new THREE.Mesh(zoneGeo,zoneMat);dropRing.position.z=.03;root.add(dropRing);
  const glow=new THREE.Mesh(new THREE.CircleGeometry(.60,64),new THREE.MeshBasicMaterial({color:0xffef9c,transparent:true,opacity:.12,side:THREE.DoubleSide}));
  glow.position.z=.025;root.add(glow);
  const shadow=new THREE.Mesh(new THREE.PlaneGeometry(5.4,3.9),new THREE.ShadowMaterial({opacity:.18}));
  shadow.position.z=-.08;shadow.receiveShadow=true;root.add(shadow);
}
function addObj(o,x,y,z=.16,s=1){o.position.set(x,y,z);o.scale.setScalar(s);root.add(o)}
function buildStage(){
  clearRoot();addBase();placed=0;regrouping=false;nextBtn.style.display='none';updatePlaceHud();
  if(stage===1){
    const pink=0xef6cae,purple=0x9b67e8;
    const R=[[-1.85,1.1],[-1.25,1.1],[-.65,1.1],[-1.85,.55],[-1.25,.55],[-.65,.55],[-1.55,0],[-.95,0]];
    const L=[[.65,1.1],[1.25,1.1],[1.85,1.1],[.65,.55],[1.25,.55],[1.85,.55],[1.25,0]];
    R.forEach(p=>addObj(makeUnit(pink),p[0],p[1]));
    L.forEach(p=>addObj(makeUnit(purple),p[0],p[1]));
    msg('اسحبي الآحاد إلى الدائرة المضيئة');
  }else if(stage===2){
    const green=0x39b978,gold=0xe0ae3d;
    let pos=[[-1.8,1.15],[-1.15,1.15],[-.5,1.15],[-1.8,.1],[-1.15,.1],[-.5,.1],[.5,1.15],[1.15,1.15],[1.8,1.15],[.5,.1],[1.15,.1]];
    pos.forEach(p=>addObj(makeRod(green),p[0],p[1],.15,.72));
    addObj(makeRod(gold),1.8,.1,.15,.72);
    msg('اسحبي العشرات إلى الدائرة المضيئة');
  }else if(stage===3){
    [[-1.25,.8],[1.25,.8],[-1.25,-.65],[1.25,-.65]].forEach((p,i)=>addObj(makeHundred(i===3?0x62b7f4:0x3d8ee8),p[0],p[1],.10,.72));
    msg('اسحبي المئات إلى الدائرة المضيئة');
  }
}

function placeRootAtScreen(clientX,clientY){
  setPointer(clientX,clientY);
  raycaster.setFromCamera(pointer,camera);
  const plane=new THREE.Plane(new THREE.Vector3(0,0,1),4.3);
  const hit=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(plane,hit)){
    root.position.copy(hit);root.position.z=-4.3;
  }else root.position.set(0,-.2,-4.3);
  root.scale.setScalar(.72);
  root.visible=true;anchored=true;placeHint.style.display='none';buildStage();
}

function setPointer(x,y){
  const r=canvas.getBoundingClientRect();
  pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1;
}

function rootFromHit(obj){let o=obj;while(o){if(o.userData&&o.userData.dragRoot)return o.userData.dragRoot;o=o.parent}return null}
function planeForRoot(){
  const q=new THREE.Quaternion();root.getWorldQuaternion(q);
  const n=new THREE.Vector3(0,0,1).applyQuaternion(q).normalize();
  const p=new THREE.Vector3(0,0,0);root.localToWorld(p);
  return new THREE.Plane().setFromNormalAndCoplanarPoint(n,p);
}

function onDown(e){
  e.preventDefault();
  if(!anchored){placeRootAtScreen(e.clientX,e.clientY);return}
  if(regrouping)return;
  setPointer(e.clientX,e.clientY);raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(draggables.filter(d=>!d.userData.placed),true);
  if(!hits.length)return;
  dragging=rootFromHit(hits[0].object);if(!dragging)return;
  dragPlane=planeForRoot();
  const w=new THREE.Vector3();if(raycaster.ray.intersectPlane(dragPlane,w)){
    root.worldToLocal(w);dragOffset.copy(dragging.position).sub(w);
  }else dragOffset.set(0,0,0);
}
function onMove(e){
  if(!dragging)return;e.preventDefault();setPointer(e.clientX,e.clientY);raycaster.setFromCamera(pointer,camera);
  const w=new THREE.Vector3();if(!raycaster.ray.intersectPlane(dragPlane,w))return;
  root.worldToLocal(w);w.add(dragOffset);
  dragging.position.x=THREE.MathUtils.clamp(w.x,-2.5,2.5);
  dragging.position.y=THREE.MathUtils.clamp(w.y,-1.45,1.55);
}
function onUp(){
  if(!dragging)return;
  const d=dragging;dragging=null;
  const inside=Math.hypot(d.position.x,d.position.y)<.83;
  if(inside&&!d.userData.placed){
    d.userData.placed=true;placed++;snap(d,placed);check();
  }
}
function snap(d,i){
  const coords=stage===3?[[-.34,.34],[.34,.34],[-.34,-.34],[.34,-.34]]:[[-.46,.36],[0,.36],[.46,.36],[-.46,0],[0,0],[.46,0],[-.46,-.36],[0,-.36],[.46,-.36],[0,-.72]];
  const p=coords[Math.min(i-1,coords.length-1)];
  d.position.x=p[0];d.position.y=p[1];
}
function check(){
  if(stage===1&&placed===10)regroupOnes();
  if(stage===2&&placed===10)regroupTens();
  if(stage===3&&placed===4)finish();
}

function animateCollapse(targets,after){
  regrouping=true;const startT=performance.now(),dur=700;
  const starts=targets.map(o=>({o,p:o.position.clone(),s:o.scale.clone()}));
  function tick(t){
    const k=Math.min(1,(t-startT)/dur),ease=1-Math.pow(1-k,3);
    starts.forEach(v=>{v.o.position.lerpVectors(v.p,new THREE.Vector3(0,0,.16),ease);v.o.scale.copy(v.s).multiplyScalar(1-ease*.96)});
    if(k<1)requestAnimationFrame(tick);else after();
  }requestAnimationFrame(tick);
}
function removePlaced(){
  const t=draggables.filter(d=>d.userData.placed);t.forEach(o=>root.remove(o));draggables=draggables.filter(d=>!d.userData.placed);return t;
}
function regroupOnes(){
  msg('10 آحاد تتحول إلى عشرة واحدة');
  const t=draggables.filter(d=>d.userData.placed);
  animateCollapse(t,()=>{removePlaced();const r=makeRod(0xe0ae3d);r.userData.placed=true;r.position.set(0,0,.14);r.scale.setScalar(.82);root.add(r);draggables=draggables.filter(x=>x!==r);msg('نكتب 5 ونحمل 1 إلى العشرات');nextBtn.style.display='inline-block'});
}
function regroupTens(){
  msg('10 عشرات تتحول إلى مئة واحدة');
  const t=draggables.filter(d=>d.userData.placed);
  animateCollapse(t,()=>{removePlaced();const h=makeHundred(0x56aaf0);h.userData.placed=true;h.position.set(0,0,.10);h.scale.setScalar(.68);root.add(h);draggables=draggables.filter(x=>x!==h);msg('نكتب 2 ونحمل 1 إلى المئات');nextBtn.style.display='inline-block'});
}
function finish(){regrouping=true;msg('اكتمل التجميع');setTimeout(()=>success.classList.add('show'),600)}

nextBtn.onclick=()=>{stage++;buildStage()};
document.getElementById('restart').onclick=reset;
document.getElementById('again').onclick=()=>{success.classList.remove('show');reset()};
document.getElementById('reposition').onclick=()=>{anchored=false;root.visible=false;placeHint.style.display='block';msg('المسي الطاولة لتثبيت الخانات والمكعبات من جديد')};
document.getElementById('help').onclick=()=>alert('الخانات واضحة أمامك: المئات باللون الأزرق، العشرات بالأخضر، والآحاد بالوردي. ابدئي بالخانة المضيئة، واسحبي قطعها إلى الدائرة. 10 آحاد تتحول إلى عشرة، و10 عشرات تتحول إلى مئة.');

function reset(){stage=1;placed=0;regrouping=false;success.classList.remove('show');nextBtn.style.display='none';anchored=true;root.position.set(0,-.35,-4.3);root.scale.setScalar(.72);root.visible=true;placeHint.style.display='none';buildStage();msg('ابدئي بالآحاد: اسحبي المكعبات الصغيرة إلى الدائرة')}

document.getElementById('startBtn').onclick=async()=>{
  hideError();
  try{
    await openCamera();
    if(!renderer)initThree();
    start.style.display='none';hud.style.display='block';
    anchored=true;root.position.set(0,-.35,-4.3);root.scale.setScalar(.72);root.visible=true;placeHint.style.display='none';
    buildStage();msg('ابدئي بالآحاد: اسحبي المكعبات الصغيرة إلى الدائرة');
  }catch(e){
    showError('لم تفتح الكاميرا. افتحي الرابط في Safari أو Chrome واسمحي باستخدام الكاميرا، ثم أعيدي المحاولة.');
  }
};

function animate(){
  requestAnimationFrame(animate);
  if(dropRing){const t=clock.getElapsedTime();dropRing.material.opacity=.68+.18*Math.sin(t*3);dropRing.scale.setScalar(1+.035*Math.sin(t*3));}
  renderer.render(scene,camera);
}
})();
</script>
</body>
</html>
