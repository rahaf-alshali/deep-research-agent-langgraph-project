<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مستودع القيمة المنزلية AR</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:0}
#three{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none}
#start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 15%,#b05f9d 0,#2c2338 40%,#09080d 90%)}
.card{width:min(92vw,430px);background:rgba(255,255,255,.97);border-radius:26px;padding:24px 19px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.42)}
.card h1{margin:0;color:#7a2f67;font-size:28px}.card p{color:#5d5662;line-height:1.8;margin:10px 0}.eq{direction:ltr;font-size:44px;font-weight:900;color:#2456d5;margin:16px 0}.eq span{color:#df4381}
.primary{border:0;width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,#a43585,#6243b6);color:#fff;font-size:19px;font-weight:900}
#hud{position:fixed;inset:0;z-index:10;display:none;pointer-events:none;color:#fff}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.icon{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(18,17,23,.70);color:#fff;font-size:21px;font-weight:900;backdrop-filter:blur(8px)}
.title{justify-self:center;padding:10px 16px;border-radius:999px;background:rgba(18,17,23,.72);border:1px solid rgba(255,255,255,.22);font-weight:900;text-align:center;backdrop-filter:blur(8px);font-size:17px;box-shadow:0 5px 18px rgba(0,0,0,.22)}
.info{position:absolute;top:max(70px,calc(env(safe-area-inset-top) + 60px));left:50%;transform:translateX(-50%);width:min(90vw,560px);background:rgba(255,255,255,.94);color:#28232b;border-radius:18px;padding:10px 14px;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.24)}
.info .eq2{direction:ltr;font-weight:900;font-size:25px}.info .step{font-weight:900;color:#7a2f67;margin-top:4px;font-size:14px}
.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.btn{pointer-events:auto;border:1px solid rgba(255,255,255,.22);background:rgba(18,17,23,.72);color:#fff;border-radius:999px;padding:10px 15px;font-weight:900}
#next{display:none;background:rgba(24,145,96,.94)}
#tip{position:absolute;bottom:max(64px,calc(env(safe-area-inset-bottom) + 56px));left:50%;transform:translateX(-50%);width:min(86vw,500px);background:rgba(255,255,255,.94);color:#2d2730;border-radius:16px;padding:10px 14px;text-align:center;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.22)}
#count{display:inline-block;margin-right:6px;padding:4px 9px;border-radius:999px;background:#7a2f67;color:white}
#result{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.26);padding:18px}
#result.show{display:flex}.resultCard{width:min(92vw,430px);background:rgba(255,255,255,.97);border-radius:28px;padding:24px;text-align:center;color:#222;box-shadow:0 25px 80px rgba(0,0,0,.4)}
.resultCard h2{color:#7a2f67;margin:4px 0 8px}.answer{direction:ltr;font-size:46px;font-weight:900;color:#178b58}.summary{margin-top:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.summary span{padding:8px 11px;border-radius:12px;background:#f4f1f5;font-weight:900}
#err{position:fixed;z-index:40;left:14px;right:14px;bottom:20px;display:none;background:#fff3cd;color:#594900;padding:13px;border-radius:14px;text-align:center;font-weight:800}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<canvas id="three"></canvas>

<div id="start">
  <div class="card">
    <h1>مستودع القيمة المنزلية</h1>
    <p>اجمعي الطلبية بطريقة المستودع: كل 10 قطع تُعبأ في صندوق عشرات، وكل 10 صناديق عشرات تُعبأ في حاوية مئة.</p>
    <div class="eq">268 + <span>157</span></div>
    <button id="startBtn" class="primary">ابدئي المهمة</button>
  </div>
</div>

<div id="hud">
  <div class="top">
    <button id="home" class="icon">⌂</button>
    <div class="title">مستودع القيمة المنزلية</div>
    <button id="restart" class="icon">↻</button>
  </div>
  <div class="info">
    <div class="eq2">268 + 157</div>
    <div id="stepText" class="step">المهمة 1 من 3: تعبئة الآحاد</div>
  </div>
  <div id="tip">اسحبي <b>10 قطع</b> إلى صندوق التعبئة <span id="count">0 / 10</span></div>
  <div class="bottom">
    <button id="move" class="btn">إعادة تمركز المستودع</button>
    <button id="next" class="btn">التالي</button>
  </div>
</div>

<div id="result">
  <div class="resultCard">
    <div style="font-size:42px">📦✨</div>
    <h2>اكتملت الطلبية!</h2>
    <div class="answer">268 + 157 = 425</div>
    <div class="summary"><span>4 مئات</span><span>2 عشرات</span><span>5 آحاد</span></div>
    <button id="again" class="primary" style="margin-top:16px">أعيدي النشاط</button>
  </div>
</div>
<div id="err"></div>

<script>
(function(){
const video=document.getElementById('camera'),canvas=document.getElementById('three'),start=document.getElementById('start'),hud=document.getElementById('hud'),stepText=document.getElementById('stepText'),tip=document.getElementById('tip'),countEl=document.getElementById('count'),nextBtn=document.getElementById('next'),result=document.getElementById('result'),err=document.getElementById('err');
let renderer,scene,camera,root,dropZone,stage=1,placed=0,regrouping=false;
let draggables=[],dragging=null,dragPlane=null,dragOffset=new THREE.Vector3();
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),clock=new THREE.Clock();

function showError(t){err.textContent=t;err.style.display='block'} function hideError(){err.style.display='none'}
async function openCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('camera');const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=s;await video.play()}
function initThree(){
 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,0,0);
 scene.add(new THREE.HemisphereLight(0xffffff,0x4a4650,1.65));const dl=new THREE.DirectionalLight(0xfff2df,2.2);dl.position.set(3,5,4);dl.castShadow=true;scene.add(dl);
 root=new THREE.Group();root.position.set(0,-.75,-5.0);root.rotation.x=-.48;root.scale.setScalar(.74);scene.add(root);
 window.addEventListener('resize',resize);canvas.addEventListener('pointerdown',onDown,{passive:false});canvas.addEventListener('pointermove',onMove,{passive:false});canvas.addEventListener('pointerup',onUp,{passive:false});canvas.addEventListener('pointercancel',onUp,{passive:false});animate()
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.42,metalness:.02})}
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m}
function tag(o,type){o.userData.dragRoot=o;o.userData.type=type;o.userData.placed=false;o.traverse(c=>c.userData.dragRoot=o);draggables.push(o)}
function parcel(color){const g=new THREE.Group();const b=box(.34,.26,.28,color);g.add(b);const band=box(.04,.265,.286,0xe7c46a);band.position.z=.01;g.add(band);tag(g,'one');return g}
function tenCrate(color){const g=new THREE.Group();const b=box(.46,.34,.72,color);g.add(b);for(let i=-3;i<=3;i++){const s=box(.475,.014,.735,0x1d7049);s.position.y=i*.045;g.add(s)}tag(g,'ten');return g}
function hundredPallet(color){const g=new THREE.Group();const b=box(1.00,.34,.86,color);g.add(b);for(let i=-4;i<=4;i++){const v=box(.018,.355,.87,0x165b99);v.position.x=i*.1;g.add(v)}for(let j=-3;j<=3;j++){const h=box(1.015,.355,.018,0x165b99);h.position.z=j*.105;g.add(h)}tag(g,'hundred');return g}
function labelSprite(text,bg){
 const c=document.createElement('canvas');c.width=480;c.height=135;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,480,135);x.fillStyle='#fff';x.font='bold 58px Tahoma, Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(text,240,70);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));s.scale.set(1.35,.38,1);return s
}
function clearRoot(){while(root.children.length)root.remove(root.children[0]);draggables=[];dragging=null}
function addFloor(){
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(5.9,3.7),new THREE.MeshStandardMaterial({color:0xf0e5d5,transparent:true,opacity:.28,roughness:.95}));floor.position.z=-.12;floor.receiveShadow=true;root.add(floor);
 const shelfL=box(1.7,.12,.72,0x734b2f);shelfL.position.set(-1.55,1.08,0);root.add(shelfL);const shelfR=shelfL.clone();shelfR.position.x=1.55;root.add(shelfR);
 const labL=labelSprite(stage===1?'8 قطع':'الكمية الأولى','#b63c78');labL.position.set(-1.55,1.58,.20);root.add(labL);
 const labR=labelSprite(stage===1?'7 قطع':'الكمية الثانية','#6045b8');labR.position.set(1.55,1.58,.20);root.add(labR);
 const zoneBase=box(1.55,.18,1.12,0xd49a22);zoneBase.position.set(0,-.78,0);root.add(zoneBase);
 dropZone=new THREE.Mesh(new THREE.RingGeometry(.47,.65,60),new THREE.MeshBasicMaterial({color:0xffe06b,transparent:true,opacity:.82,side:THREE.DoubleSide}));dropZone.position.set(0,-.74,.18);root.add(dropZone);
 const zlab=labelSprite(stage===3?'منطقة التسليم':'صندوق التعبئة','#c58419');zlab.position.set(0,-1.45,.23);root.add(zlab)
}
function add(o,x,y,z=.22,s=1){o.position.set(x,y,z);o.scale.setScalar(s);root.add(o)}
function layout(items,left){
 const xs=left?[-2.15,-1.65,-1.15]:[1.15,1.65,2.15],ys=[.72,.25,-.22];
 let k=0;for(let r=0;r<ys.length;r++){for(let c=0;c<xs.length;c++){if(k>=items.length)return;add(items[k++],xs[c],ys[r])}}
}
function buildStage(){
 clearRoot();addFloor();placed=0;regrouping=false;nextBtn.style.display='none';countEl.textContent='0 / '+(stage===3?'4':'10');
 if(stage===1){
   stepText.textContent='المهمة 1 من 3: تعبئة الآحاد';
   tip.firstChild.textContent='اسحبي 10 قطع إلى صندوق التعبئة '; countEl.style.display='inline-block';
   layout(Array.from({length:8},()=>parcel(0xe86aa7)),true);layout(Array.from({length:7},()=>parcel(0x8c67dc)),false)
 }else if(stage===2){
   stepText.textContent='المهمة 2 من 3: تعبئة العشرات';
   tip.firstChild.textContent='اسحبي 10 صناديق عشرات إلى الحاوية '; countEl.style.display='inline-block';
   const a=Array.from({length:6},()=>tenCrate(0x35ad70));const b=Array.from({length:5},()=>tenCrate(0x35ad70));b.push(tenCrate(0xe1a933));layout(a,true);layout(b,false)
 }else{
   stepText.textContent='المهمة 3 من 3: تجميع المئات';
   tip.firstChild.textContent='اسحبي الحاويات الأربع إلى منطقة التسليم '; countEl.style.display='inline-block';
   layout([hundredPallet(0x3b8fe9),hundredPallet(0x3b8fe9)],true);layout([hundredPallet(0x3b8fe9),hundredPallet(0x65b8f4)],false)
 }
}
function setPointer(x,y){const r=canvas.getBoundingClientRect();pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1}
function dragRoot(o){let n=o;while(n){if(n.userData&&n.userData.dragRoot)return n.userData.dragRoot;n=n.parent}return null}
function plane(){const q=new THREE.Quaternion();root.getWorldQuaternion(q);const n=new THREE.Vector3(0,0,1).applyQuaternion(q).normalize();const p=new THREE.Vector3();root.localToWorld(p);return new THREE.Plane().setFromNormalAndCoplanarPoint(n,p)}
function onDown(e){e.preventDefault();if(regrouping)return;setPointer(e.clientX,e.clientY);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(draggables.filter(d=>!d.userData.placed),true);if(!hits.length)return;dragging=dragRoot(hits[0].object);if(!dragging)return;dragPlane=plane();const w=new THREE.Vector3();if(raycaster.ray.intersectPlane(dragPlane,w)){root.worldToLocal(w);dragOffset.copy(dragging.position).sub(w)}}
function onMove(e){if(!dragging)return;e.preventDefault();setPointer(e.clientX,e.clientY);raycaster.setFromCamera(pointer,camera);const w=new THREE.Vector3();if(!raycaster.ray.intersectPlane(dragPlane,w))return;root.worldToLocal(w);w.add(dragOffset);dragging.position.x=THREE.MathUtils.clamp(w.x,-2.45,2.45);dragging.position.y=THREE.MathUtils.clamp(w.y,-1.05,1.18)}
function onUp(){if(!dragging)return;const d=dragging;dragging=null;const inside=Math.hypot(d.position.x,d.position.y+.74)<.72;if(inside&&!d.userData.placed){d.userData.placed=true;placed++;snap(d,placed);countEl.textContent=placed+' / '+(stage===3?'4':'10');check()}}
function snap(o,i){
 const pts=stage===3?[[-.26,-.62],[.26,-.62],[-.26,-.90],[.26,-.90]]:[[-.36,-.58],[0,-.58],[.36,-.58],[-.36,-.80],[0,-.80],[.36,-.80],[-.36,-1.02],[0,-1.02],[.36,-1.02],[0,-1.22]];
 const p=pts[Math.min(i-1,pts.length-1)];o.position.x=p[0];o.position.y=p[1]
}
function collapse(list,done){
 regrouping=true;const st=performance.now(),dur=650,starts=list.map(o=>({o,p:o.position.clone(),s:o.scale.clone()}));
 function tick(t){const k=Math.min(1,(t-st)/dur),e=1-Math.pow(1-k,3);starts.forEach(v=>{v.o.position.lerpVectors(v.p,new THREE.Vector3(0,-.78,.22),e);v.o.scale.copy(v.s).multiplyScalar(1-e*.94)});if(k<1)requestAnimationFrame(tick);else done()}requestAnimationFrame(tick)
}
function removePlaced(){const a=draggables.filter(d=>d.userData.placed);a.forEach(o=>root.remove(o));draggables=draggables.filter(d=>!d.userData.placed)}
function check(){
 if(stage===1&&placed===10){
   const a=draggables.filter(d=>d.userData.placed);collapse(a,()=>{removePlaced();const carry=tenCrate(0xe1a933);carry.userData.placed=true;draggables=draggables.filter(x=>x!==carry);add(carry,0,-.72,.26,.95);tip.firstChild.textContent='أحسنتِ! تحولت 10 قطع إلى صندوق عشرة واحد، وبقي 5 آحاد. ';countEl.style.display='none';nextBtn.style.display='inline-block';regrouping=false})
 }
 if(stage===2&&placed===10){
   const a=draggables.filter(d=>d.userData.placed);collapse(a,()=>{removePlaced();const carry=hundredPallet(0x63b8f3);carry.userData.placed=true;draggables=draggables.filter(x=>x!==carry);add(carry,0,-.72,.22,.85);tip.firstChild.textContent='رائع! تحولت 10 عشرات إلى مئة واحدة، وبقيت عشرتان. ';countEl.style.display='none';nextBtn.style.display='inline-block';regrouping=false})
 }
 if(stage===3&&placed===4){regrouping=true;tip.firstChild.textContent='اكتمل التجميع: 4 مئات و2 عشرات و5 آحاد. ';countEl.style.display='none';setTimeout(()=>result.classList.add('show'),650)}
}
function reset(){stage=1;result.classList.remove('show');buildStage()}
document.getElementById('restart').onclick=reset;
document.getElementById('home').onclick=()=>{hud.style.display='none';start.style.display='flex'};
document.getElementById('move').onclick=()=>{root.position.set(0,-.75,-5.0);root.scale.setScalar(.74);buildStage()};
document.getElementById('next').onclick=()=>{stage++;buildStage()};
document.getElementById('again').onclick=reset;
document.getElementById('startBtn').onclick=async()=>{hideError();try{await openCamera();if(!renderer)initThree();start.style.display='none';hud.style.display='block';reset()}catch(e){showError('لم تفتح الكاميرا. افتحي الرابط في Safari أو Chrome واسمحي باستخدام الكاميرا ثم أعيدي المحاولة.')}};
function animate(){requestAnimationFrame(animate);if(dropZone){const t=clock.getElapsedTime();dropZone.material.opacity=.65+.18*Math.sin(t*3);dropZone.scale.setScalar(1+.035*Math.sin(t*3))}renderer&&renderer.render(scene,camera)}
})();
</script>
</body>
</html>
